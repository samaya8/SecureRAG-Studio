name: SecureRAG CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Lint, Type-check, Test and Build
    runs-on: ubuntu-latest

    env:
      # CI never uses a real key. The mock provider makes the whole pipeline
      # deterministic and keeps secrets out of the workflow entirely.
      AI_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the corpus manifest is up to date
        run: |
          node scripts/build-corpus-manifest.mjs
          git diff --exit-code corpus/corpus-manifest.json

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "A real environment file is committed."
            exit 1
          fi

  evaluation:
    name: Retrieval Evaluation
    runs-on: ubuntu-latest
    needs: quality-checks

    env:
      AI_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start the application
        run: |
          npm start -- --port 3000 &
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://localhost:3000/api/securerag/documents > /dev/null && break
          done

      - name: Run the evaluation dataset
        run: BASE_URL=http://localhost:3000 npm run eval

      - name: Upload the retrieval quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-report
          path: evaluation/results/
